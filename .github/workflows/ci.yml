# CI Build and Test Workflow
# This workflow builds and tests the CTK project on multiple platforms
name: CI Build and Test

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch:

env:
  # Use system packages where possible for speed
  # Only build from source as fallback
  OPENCV_VERSION: '4.10.0'
  GTEST_VERSION: '1.15.2'
  BENCHMARK_VERSION: '1.9.0'

jobs:
  build-and-test:
    name: Build on ${{ matrix.os }} with ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows builds
          - os: windows-latest
            compiler: msvc
            cmake_generator: "Visual Studio 17 2022"
            build_type: Release

          - os: windows-latest
            compiler: clang
            cmake_generator: "Ninja"
            build_type: Release

          # Linux builds
          - os: ubuntu-latest
            compiler: gcc
            cmake_generator: "Unix Makefiles"
            build_type: Release
            cc: gcc-11
            cxx: g++-11

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Platform-specific dependency installation
    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          libopencv-dev \
          libgtest-dev \
          libbenchmark-dev

    # Windows: Use vcpkg for pre-built binaries with GitHub Actions caching
    - name: Cache vcpkg binary packages (Windows)
      if: runner.os == 'Windows'
      uses: actions/cache@v4
      with:
        path: D:\a\ctk\ctk\vcpkg_cache
        key: vcpkg-${{ runner.os }}-${{ matrix.compiler }}-${{ hashFiles('**/vcpkg.json', '.github/workflows/ci.yml') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-${{ matrix.compiler }}-
          vcpkg-${{ runner.os }}-

    - name: Setup vcpkg (Windows)
      if: runner.os == 'Windows'
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: '71b0a7e48e0096c731048ee8cda9cf0e0f1d87bb'  # vcpkg 2024.12.16 release
        doNotCache: true  # Disable built-in caching, we use actions/cache instead

    - name: Install dependencies via vcpkg (Windows)
      if: runner.os == 'Windows'
      env:
        VCPKG_BINARY_SOURCES: 'clear;files,D:\a\ctk\ctk\vcpkg_cache,readwrite'  # Use files provider with GitHub Actions cache
      run: |
        vcpkg install opencv4:x64-windows gtest:x64-windows benchmark:x64-windows
      shell: pwsh

    # Install LLVM/Clang for Windows Clang builds
    - name: Install LLVM/Clang (Windows)
      if: runner.os == 'Windows' && matrix.compiler == 'clang'
      run: |
        choco install llvm ninja -y
      shell: pwsh

    # No need to build dependencies - using system packages!

    # Set compiler environment variables for Linux
    - name: Set compiler (Linux)
      if: runner.os == 'Linux'
      run: |
        echo "CC=${{ matrix.cc }}" >> $GITHUB_ENV
        echo "CXX=${{ matrix.cxx }}" >> $GITHUB_ENV
      shell: bash

    # Configure CTK project
    - name: Configure CTK (Windows MSVC)
      if: runner.os == 'Windows' && matrix.compiler == 'msvc'
      run: |
        mkdir build
        cd build
        cmake .. `
          -G "${{ matrix.cmake_generator }}" `
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
      shell: pwsh

    - name: Configure CTK (Windows Clang)
      if: runner.os == 'Windows' && matrix.compiler == 'clang'
      run: |
        mkdir build
        cd build
        cmake .. `
          -G "${{ matrix.cmake_generator }}" `
          -DCMAKE_C_COMPILER=clang `
          -DCMAKE_CXX_COMPILER=clang++ `
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
      shell: pwsh

    - name: Configure CTK (Linux)
      if: runner.os == 'Linux'
      run: |
        mkdir build
        cd build
        cmake .. \
          -G "${{ matrix.cmake_generator }}" \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      shell: bash

    # Build CTK project
    - name: Build CTK (Windows MSVC)
      if: runner.os == 'Windows' && matrix.compiler == 'msvc'
      run: |
        cd build
        cmake --build . --config ${{ matrix.build_type }} --parallel 2
      shell: pwsh

    - name: Build CTK (Windows Clang)
      if: runner.os == 'Windows' && matrix.compiler == 'clang'
      run: |
        cd build
        ninja -j 2
      shell: pwsh

    - name: Build CTK (Linux)
      if: runner.os == 'Linux'
      run: |
        cd build
        cmake --build . --parallel 2
      shell: bash

    # Run tests
    - name: Run Tests (Windows MSVC)
      if: runner.os == 'Windows' && matrix.compiler == 'msvc'
      run: |
        cd build/ctkunittests/${{ matrix.build_type }}
        ./unittests.exe
      shell: pwsh
      continue-on-error: false

    - name: Run Tests (Windows Clang)
      if: runner.os == 'Windows' && matrix.compiler == 'clang'
      run: |
        cd build/ctkunittests
        ./unittests.exe
      shell: pwsh
      continue-on-error: false

    - name: Run Tests (Linux)
      if: runner.os == 'Linux'
      run: |
        cd build/ctkunittests
        ./unittests
      shell: bash
      continue-on-error: false

    # Upload artifacts for failed builds
    - name: Upload build logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-${{ matrix.os }}-${{ matrix.compiler }}
        path: |
          build/CMakeFiles/CMakeOutput.log
          build/CMakeFiles/CMakeError.log
        retention-days: 7

  # Summary job that depends on all build jobs
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: build-and-test
    if: always()

    steps:
    - name: Check build status
      run: |
        if [ "${{ needs.build-and-test.result }}" != "success" ]; then
          echo "One or more builds failed!"
          exit 1
        fi
        echo "All builds passed successfully!"