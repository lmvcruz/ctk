name: CI Build and Test

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch:

env:
  OPENCV_VERSION: '4.10.0'
  GTEST_VERSION: '1.15.2'
  BENCHMARK_VERSION: '1.9.0'

jobs:
  build-and-test:
    name: Build on ${{ matrix.os }} with ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows builds
          - os: windows-latest
            compiler: msvc
            cmake_generator: "Visual Studio 17 2022"
            build_type: Release

          # Linux builds
          - os: ubuntu-latest
            compiler: gcc
            cmake_generator: "Unix Makefiles"
            build_type: Release
            cc: gcc-11
            cxx: g++-11

          - os: ubuntu-latest
            compiler: clang
            cmake_generator: "Ninja"
            build_type: Release
            cc: clang-14
            cxx: clang++-14

          # macOS builds
          - os: macos-latest
            compiler: clang
            cmake_generator: "Ninja"
            build_type: Release
            cc: clang
            cxx: clang++

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Platform-specific dependency installation
    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          libgtk-3-dev \
          libavcodec-dev \
          libavformat-dev \
          libswscale-dev \
          libv4l-dev \
          libxvidcore-dev \
          libx264-dev \
          libjpeg-dev \
          libpng-dev \
          libtiff-dev \
          gfortran \
          openexr \
          libatlas-base-dev \
          libtbb-dev

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew update
        brew install cmake ninja pkg-config jpeg libpng libtiff openexr tbb

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install ninja -y

    # Cache dependencies to speed up builds
    - name: Cache OpenCV
      id: cache-opencv
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/opencv-build
        key: ${{ runner.os }}-opencv-${{ env.OPENCV_VERSION }}-${{ matrix.compiler }}

    - name: Build OpenCV
      if: steps.cache-opencv.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 --branch ${{ env.OPENCV_VERSION }} https://github.com/opencv/opencv.git
        cd opencv
        mkdir build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/opencv-build \
          -DBUILD_TESTS=OFF \
          -DBUILD_PERF_TESTS=OFF \
          -DBUILD_EXAMPLES=OFF \
          -DBUILD_DOCS=OFF \
          -DWITH_CUDA=OFF \
          -DBUILD_opencv_apps=OFF
        cmake --build . --config Release --parallel 2
        cmake --install . --config Release
      shell: bash

    - name: Cache GTest
      id: cache-gtest
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/gtest-install
        key: ${{ runner.os }}-gtest-${{ env.GTEST_VERSION }}

    - name: Build GTest
      if: steps.cache-gtest.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 --branch v${{ env.GTEST_VERSION }} https://github.com/google/googletest.git
        cd googletest
        mkdir build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/gtest-install
        cmake --build . --config Release --parallel 2
        cmake --install . --config Release
      shell: bash

    - name: Cache Google Benchmark
      id: cache-benchmark
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/benchmark-install
        key: ${{ runner.os }}-benchmark-${{ env.BENCHMARK_VERSION }}

    - name: Build Google Benchmark
      if: steps.cache-benchmark.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 --branch v${{ env.BENCHMARK_VERSION }} https://github.com/google/benchmark.git
        cd benchmark
        mkdir build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/benchmark-install \
          -DBENCHMARK_ENABLE_TESTING=OFF
        cmake --build . --config Release --parallel 2
        cmake --install . --config Release
      shell: bash

    # Set compiler environment variables for Linux/macOS
    - name: Set compiler (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        echo "CC=${{ matrix.cc }}" >> $GITHUB_ENV
        echo "CXX=${{ matrix.cxx }}" >> $GITHUB_ENV
      shell: bash

    # Configure CTK project
    - name: Configure CTK (Windows MSVC)
      if: runner.os == 'Windows' && matrix.compiler == 'msvc'
      run: |
        mkdir build
        cd build
        cmake .. `
          -G "${{ matrix.cmake_generator }}" `
          -DOpenCV_DIR="${{ github.workspace }}/opencv-build" `
          -DGTest_DIR="${{ github.workspace }}/gtest-install/lib/cmake/GTest" `
          -Dbenchmark_DIR="${{ github.workspace }}/benchmark-install/lib/cmake/benchmark"
      shell: pwsh

    - name: Configure CTK (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        mkdir build
        cd build
        cmake .. \
          -G "${{ matrix.cmake_generator }}" \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DOpenCV_DIR=${{ github.workspace }}/opencv-build \
          -DGTest_DIR=${{ github.workspace }}/gtest-install/lib/cmake/GTest \
          -Dbenchmark_DIR=${{ github.workspace }}/benchmark-install/lib/cmake/benchmark
      shell: bash

    # Build CTK project
    - name: Build CTK (Windows)
      if: runner.os == 'Windows'
      run: |
        cd build
        cmake --build . --config ${{ matrix.build_type }} --parallel 2
      shell: pwsh

    - name: Build CTK (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        cd build
        cmake --build . --parallel 2
      shell: bash

    # Run tests
    - name: Run Tests (Windows)
      if: runner.os == 'Windows'
      run: |
        cd build/ctkunittests/${{ matrix.build_type }}
        ./unittests.exe
      shell: pwsh
      continue-on-error: false

    - name: Run Tests (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        cd build/ctkunittests
        ./unittests
      shell: bash
      continue-on-error: false

    # Upload artifacts for failed builds
    - name: Upload build logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-${{ matrix.os }}-${{ matrix.compiler }}
        path: |
          build/CMakeFiles/CMakeOutput.log
          build/CMakeFiles/CMakeError.log
        retention-days: 7

  # Summary job that depends on all build jobs
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: build-and-test
    if: always()

    steps:
    - name: Check build status
      run: |
        if [ "${{ needs.build-and-test.result }}" != "success" ]; then
          echo "One or more builds failed!"
          exit 1
        fi
        echo "All builds passed successfully!"
